name: Run Test Suite

on:
  push:
    branches: [ "root" ]
  pull_request:
    branches: [ "root" ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: macos-26 
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0'
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
